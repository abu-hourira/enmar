<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="siteTitleTag"></title>
<meta name="description" content="Complete your order for 100% pure organic honey, ghee, and pantry essentials. Cash on delivery available across Bangladesh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/css/harvest-market.css?v=2.2" as="style">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<link rel="icon" id="siteFavicon" href="/favicon.ico">
<link rel="stylesheet" href="/css/harvest-market.css?v=2.2">
<script type="speculationrules">
{
  "prefetch": [{ "source": "list", "urls": ["/", "/my-orders"], "eagerness": "moderate" }],
  "prerender": [{ "source": "list", "urls": ["/my-orders"], "eagerness": "conservative" }]
}
</script>
<script src="/js/theme.js?v=2.2"></script>
<script src="/js/branding.js"></script>
<style>
/* ── Shell ── */
.checkout-page {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 860px) {
  .checkout-page { grid-template-columns: 1fr; }
  .checkout-sticky { position: static; }
}

/* ── Left column ── */
.checkout-page h1 {
  font-family: var(--font-display);
  color: var(--forest);
  font-size: 2rem;
  margin: 0 0 28px;
  grid-column: 1 / -1;
}
.section-block { margin-bottom: 28px; }
.section-block h3 {
  font-family: var(--font-mono);
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-soft);
  margin: 0 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .span2 { grid-column: span 2; }
@media (max-width: 520px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span2 { grid-column: span 1; }
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-family: var(--font-mono);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-soft);
}
.field input, .field select {
  padding: 11px 12px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: .9rem;
}
.field input:focus, .field select:focus {
  outline: 2px solid var(--forest);
  outline-offset: 2px;
}
.payment-note {
  font-family: var(--font-mono);
  font-size: .68rem;
  color: var(--ink-soft);
  margin-top: 8px;
  line-height: 1.6;
}

/* ── Payment Method List (Minimal & Clean) ── */
.payment-methods-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.payment-method-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all .15s ease;
  position: relative;
}
.payment-method-card.is-selected {
  border-color: var(--forest);
  background: var(--paper);
}
.payment-method-card.is-disabled {
  background: var(--paper-alt);
  border-color: var(--line);
  opacity: 0.6;
  cursor: not-allowed;
}
.payment-method-card input[type="radio"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.pm-radio-disc {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.payment-method-card.is-selected .pm-radio-disc {
  border-color: var(--forest);
  background: var(--forest);
}
.payment-method-card.is-selected .pm-radio-disc::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffffff;
}
.payment-method-card.is-disabled .pm-radio-disc {
  border-color: var(--line);
  background: transparent;
}
.pm-title {
  font-size: .88rem;
  font-weight: 500;
  color: var(--ink);
}
.payment-method-card.is-disabled .pm-title {
  color: var(--ink-soft);
}
.pm-status {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: .7rem;
  color: var(--ink-soft);
}

/* ── Right column — order summary ── */
.checkout-sticky { position: sticky; top: 96px; }
.summary-box {
  background: var(--paper-alt);
  border: 1px solid var(--line);
  padding: 24px;
}
.summary-box h2 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: var(--forest);
  margin: 0 0 16px;
}
.summary-items { margin-bottom: 16px; }
.summary-line {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: .85rem;
}
.summary-line:last-child { border-bottom: none; }
.summary-line .s-name { flex: 1; }
.summary-line .s-qty {
  font-family: var(--font-mono);
  font-size: .72rem;
  color: var(--ink-soft);
  white-space: nowrap;
}
.summary-line .s-price {
  font-family: var(--font-mono);
  font-size: .8rem;
  white-space: nowrap;
}
.summary-totals { border-top: 1px solid var(--line); padding-top: 12px; }
.summary-totals .row {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: .82rem;
  color: var(--ink-soft);
  padding: 4px 0;
}
.summary-totals .row.total {
  color: var(--ink);
  font-size: 1.1rem;
  border-top: 1px solid var(--line);
  margin-top: 6px;
  padding-top: 10px;
}
.summary-empty {
  color: var(--ink-soft);
  font-size: .85rem;
  padding: 16px 0;
  text-align: center;
}

/* ── Place order button ── */
.btn-place {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  background: var(--tomato);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: .85rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  border: none;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-place:disabled { opacity: .4; cursor: not-allowed; }
.btn-place:not(:disabled):hover { opacity: .88; }

/* ── Free shipping nudge ── */
.free-shipping-nudge {
  font-family: var(--font-mono);
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--forest);
  background: var(--paper);
  border: 1px dashed var(--forest);
  padding: 7px 10px;
  margin-bottom: 14px;
  text-align: center;
}

/* ── Confirmation screen ── */
.confirmation {
  max-width: 580px;
  margin: 40px auto 60px;
  padding: 0 20px;
  text-align: center;
}
.confirmation-badge {
  width: 64px;
  height: 64px;
  background: #f0fdf4;
  border: 2px solid #bbf7d0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  color: var(--forest);
  box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
}
.confirmation-badge svg { color: var(--forest); width: 36px; height: 36px; }
.confirmation h1 {
  font-family: var(--font-display);
  color: var(--forest);
  font-size: 2.1rem;
  margin: 0 0 8px;
}
.confirmation p { color: var(--ink-soft); margin-bottom: 8px; font-size: 0.95rem; }
.order-number {
  display: inline-block;
  margin: 10px 0 14px;
  padding: 8px 18px;
  background: var(--paper-alt);
  border: 1.5px dashed var(--forest);
  border-radius: 6px;
  font-family: var(--font-mono);
  color: var(--forest);
  font-weight: 700;
  letter-spacing: .05em;
}
.order-prompt-box {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 10px;
  padding: 18px 20px;
  margin: 20px 0;
  text-align: left;
}
.order-prompt-title {
  font-weight: 700;
  color: var(--forest);
  font-size: 0.95rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.order-prompt-desc {
  font-size: 0.84rem;
  color: #166534;
  line-height: 1.45;
  margin-bottom: 14px;
}
.prompt-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 480px) {
  .prompt-btn-grid { grid-template-columns: 1fr; }
}
.btn-prompt-receipt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 14px;
  background: #15803d;
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  text-decoration: none;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(21, 128, 61, 0.25);
  transition: all .15s ease;
}
.btn-prompt-receipt:hover {
  background: #166534;
  transform: translateY(-1px);
}
.btn-prompt-history {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 14px;
  background: #ffffff;
  color: var(--forest);
  border: 1.5px solid var(--forest);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  text-decoration: none;
  border-radius: 6px;
  transition: all .15s ease;
}
.btn-prompt-history:hover {
  background: var(--paper-alt);
}
.confirmation-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* ── Review modal ── */
.review-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(31,58,46,.55);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.review-modal {
  background: var(--paper);
  border: 1px solid var(--line);
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px 28px 24px;
  position: relative;
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }
.review-modal h2 {
  font-family: var(--font-display);
  color: var(--forest);
  font-size: 1.4rem;
  margin: 0 0 4px;
}
.review-modal .review-subtitle {
  font-size: .8rem;
  color: var(--ink-soft);
  margin: 0 0 20px;
}
.review-section-label {
  font-family: var(--font-mono);
  font-size: .62rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-soft);
  margin: 0 0 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
}
.review-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: .85rem;
  padding: 5px 0;
  color: var(--ink);
}
.review-row .rv-label { color: var(--ink-soft); font-size: .8rem; }
.review-row.total-row {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: .95rem;
  border-top: 1px solid var(--line);
  margin-top: 6px;
  padding-top: 10px;
}
.review-items { margin-bottom: 16px; }
.review-delivery { margin-bottom: 20px; }
.review-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.review-actions .btn-confirm {
  flex: 1;
  padding: 13px;
  background: var(--tomato);
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  border: none;
  cursor: pointer;
  transition: opacity .15s;
}
.review-actions .btn-confirm:hover { opacity: .88; }
.review-actions .btn-back {
  flex: 1;
  padding: 13px;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .05em;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: background .15s;
}
.review-actions .btn-back:hover { background: var(--paper-alt); }

/* ── Auth gate ── */
.auth-gate {
  max-width: 480px;
  margin: 60px auto;
  padding: 36px 28px;
  background: var(--paper, #ffffff);
  border: 1px solid var(--line, #e2dcd2);
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
  text-align: center;
}
.auth-gate-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 18px;
  background: var(--paper-alt, #f5efe6);
  color: var(--forest, #631e2a);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.auth-gate h2 {
  font-family: var(--font-display, inherit);
  color: var(--forest, #631e2a);
  font-size: 1.45rem;
  margin-bottom: 10px;
}
.auth-gate p {
  color: var(--ink-soft, #666);
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 24px;
}
.auth-gate-btn-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn-auth-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--forest, #631e2a);
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  transition: transform .15s, background .15s, box-shadow .15s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}
.btn-auth-primary:hover {
  background: var(--forest-deep, #47161e);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  color: #ffffff;
}
.btn-auth-secondary {
  display: inline-block;
  color: var(--forest, #631e2a);
  font-size: 0.88rem;
  font-weight: 600;
  text-decoration: none;
  padding: 8px;
  transition: opacity .15s;
}
.btn-auth-secondary:hover {
  text-decoration: underline;
  opacity: 0.85;
}

/* ── Message notice ── */
#checkoutMessage:not(:empty) { margin-bottom: 16px; }
.notice {
  padding: 10px 12px;
  margin: 8px 0;
  background: var(--paper-alt);
  border-left: 3px solid var(--tomato);
  color: var(--ink-soft);
  font-size: .85rem;
}
.notice.ok { border-color: var(--forest); }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="site-header">
  <a href="/" class="logo">
    <span id="logoIcon"></span>
    <span id="brandName"></span>
  </a>
  <div class="header-right">
    <a href="/" class="account-btn">← Shop</a>
  </div>
</header>

<!-- ── MAIN ── -->
<main id="main"></main>

<script>
/* ── helpers ── */
const taka  = v => `৳${Number(v || 0).toFixed(2)}`;
const esc   = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function showNotice(el, text, ok = false) {
  if (!el) return;
  el.innerHTML = `<div class="notice${ok ? ' ok' : ''}">${esc(text)}</div>`;
}

/* ── cart helpers (mirrors harvest-market.js) ── */
const STORAGE_KEY = 'enmarCart';
function getCart()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function clearCart(){ localStorage.setItem(STORAGE_KEY, JSON.stringify([])); }

let PRODUCTS = [];
let SHIPPING_FLAT = 80;
let SHIPPING_FREE = 1500;

function effectivePrice(p) {
  if (!p.discount || p.discount <= 0) return p.price;
  return Math.round(p.price * (1 - p.discount / 100) * 100) / 100;
}

function getLines() {
  return getCart()
    .map(c => ({ ...c, product: PRODUCTS.find(p => p.id === c.id) }))
    .filter(l => l.product);
}

let _siteSettings = {};

/* ── render confirmation screen ── */
function renderConfirmation(order, userName) {
  const orderObj = typeof order === 'object' ? order : { id: order, number: order };
  const orderId = orderObj.id || '';
  const orderNumber = orderObj.number || order;
  const msg = (typeof order === 'object' && (order.customerMessage || order.note)) || (_siteSettings && _siteSettings.defaultOrderMessage) || 'Thank you for your order.';
  const heading = (_siteSettings && _siteSettings.orderSuccessHeading) || 'Order Placed Successfully!';
  const subtext = (_siteSettings && _siteSettings.orderSuccessMessage) || 'Your order is confirmed and currently in process. Our dispatch team will deliver farm-fresh produce to your doorstep.';
  const receiptUrl = `/receipt?id=${orderId || orderNumber}`;

  document.getElementById('main').innerHTML = `
    <div class="confirmation">
      <div class="confirmation-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>

      <h1>${esc(heading)}</h1>
      <p>Thank you, <strong>${esc(userName || 'Customer')}</strong>. Your order has been securely registered.</p>
      
      <div class="order-number">Order Reference: ${esc(orderNumber)}</div>

      ${msg ? `
      <div style="background:var(--paper-alt);border-left:3px solid var(--forest);padding:10px 14px;border-radius:6px;margin:10px auto 16px;max-width:440px;font-size:.85rem;color:var(--forest);font-weight:600;text-align:left">
        Store Note: ${esc(msg)}
      </div>` : ''}

      <p style="font-size:0.86rem;color:var(--ink-soft);max-width:460px;margin:0 auto 16px">${esc(subtext)}</p>

      <!-- Instant Suggested Actions: Money Receipt & Order History -->
      <div class="order-prompt-box">
        <div class="order-prompt-title">
          <span>Order Options &amp; Documents</span>
        </div>
        <div class="order-prompt-desc">
          You can download/print your official money receipt with site name right now, or view your order history to track live status and delivery.
        </div>
        <div class="prompt-btn-grid">
          <a href="${receiptUrl}" target="_blank" class="btn-prompt-receipt" title="Download official money receipt and tax invoice">
            Download Receipt
          </a>
          <a href="/my-orders" class="btn-prompt-history" title="View order in your personal order history list">
            View Order History
          </a>
        </div>
      </div>

      <div class="confirmation-actions">
        <a href="/" class="account-btn" style="font-size:0.82rem;padding:9px 18px">Continue Shopping</a>
      </div>
    </div>`;

  // Scroll to top of page smoothly so customer sees full confirmation prompt
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── render checkout form ── */
function renderForm(user) {
  const lines = getLines();
  const subtotal = lines.reduce((s, l) => s + effectivePrice(l.product) * l.qty, 0);
  const shipping = subtotal >= SHIPPING_FREE ? 0 : SHIPPING_FLAT;
  const total = subtotal + shipping;
  const nudgeAmt = SHIPPING_FREE - subtotal;

  document.getElementById('main').innerHTML = `
    <div class="checkout-page">
      <h1>Checkout</h1>

      <!-- LEFT: form -->
      <div>
        <div id="checkoutMessage"></div>

        <form id="checkoutForm" novalidate>
          <!-- Delivery -->
          <div class="section-block">
            <h3>Delivery in Bangladesh</h3>
            <div class="form-grid">
              <div class="field span2">
                <label for="delivName">Full Name</label>
                <input type="text" id="delivName" value="${esc(user.name || '')}" required placeholder="Your full name">
              </div>
              <div class="field span2">
                <label for="delivPhone">Mobile Number</label>
                <input type="tel" id="delivPhone" value="${esc(user.phone || '')}" required placeholder="01XXXXXXXXX" pattern="01[0-9]{9}">
              </div>
              <div class="field span2">
                <label for="delivAddress">House, Road, Area Address</label>
                <input type="text" id="delivAddress" value="${esc(user.address || '')}" required placeholder="e.g. House 12, Road 4, Sector 7, Uttara">
              </div>
              <div class="field">
                <label for="delivCity">District / City</label>
                <input type="text" id="delivCity" value="${esc(user.city || '')}" required placeholder="e.g. Dhaka">
              </div>
              <div class="field">
                <label for="delivZip">Postal Code (Optional)</label>
                <input type="text" id="delivZip" value="${esc(user.zip || '')}" placeholder="e.g. 1230">
              </div>
              <div class="field span2">
                <label for="delivNotes">Delivery Notes / Landmark (Optional)</label>
                <input type="text" id="delivNotes" value="${esc(user.notes || '')}" placeholder="e.g. Near Mascot Plaza, 4th floor">
              </div>
            </div>
          </div>

          <!-- Payment Method -->
          <div class="section-block">
            <h3>Payment</h3>
            <div class="payment-methods-list">
              <!-- Cash on Delivery -->
              <label class="payment-method-card is-selected" id="cardCod">
                <input type="radio" name="payOption" value="Cash on Delivery" checked>
                <div class="pm-radio-disc"></div>
                <span class="pm-title">Cash on Delivery</span>
              </label>

              <!-- bKash -->
              <div class="payment-method-card is-disabled" id="cardBkash">
                <input type="radio" name="payOption" value="bKash" disabled>
                <div class="pm-radio-disc"></div>
                <span class="pm-title">bKash</span>
                <span class="pm-status">Not Available</span>
              </div>

              <!-- Nagad -->
              <div class="payment-method-card is-disabled" id="cardNagad">
                <input type="radio" name="payOption" value="Nagad" disabled>
                <div class="pm-radio-disc"></div>
                <span class="pm-title">Nagad</span>
                <span class="pm-status">Not Available</span>
              </div>
            </div>

            <input type="hidden" id="payMethod" value="Cash on Delivery">
          </div>
        </form>
      </div>

      <!-- RIGHT: summary -->
      <div class="checkout-sticky">
        <div class="summary-box">
          <h2>Order Summary</h2>
          ${nudgeAmt > 0 && nudgeAmt < SHIPPING_FREE
            ? `<div class="free-shipping-nudge">Add ${taka(nudgeAmt)} more for free shipping</div>`
            : ''}
          <div class="summary-items">
            ${lines.map(l => `
              <div class="summary-line">
                <span class="s-name">${esc(l.product.name)}</span>
                <span class="s-qty">× ${l.qty}</span>
                <span class="s-price">${taka(effectivePrice(l.product) * l.qty)}</span>
              </div>`).join('')}
          </div>
          <div class="summary-totals">
            <div class="row"><span>Subtotal</span><span>${taka(subtotal)}</span></div>
            <div class="row"><span>Shipping${shipping === 0 ? ' (free)' : ''}</span><span>${taka(shipping)}</span></div>
            <div class="row total"><span>Total</span><span>${taka(total)}</span></div>
          </div>
          <button type="submit" form="checkoutForm" class="btn-place" id="placeBtn">
            Place Order — ${taka(total)}
          </button>
        </div>
      </div>
    </div>`;

  /* ── review modal ── */
  function showReviewModal(delivery, payMethod, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'review-overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'review-title');

    const itemsHtml = lines.map(l => `
      <div class="review-row">
        <span>${esc(l.product.name)} <span style="color:var(--ink-soft)">× ${l.qty}</span></span>
        <span>${taka(effectivePrice(l.product) * l.qty)}</span>
      </div>`).join('');

    overlay.innerHTML = `
      <div class="review-modal">
        <h2 id="review-title">Review Your Order</h2>
        <p class="review-subtitle">Please confirm your details before placing the order.</p>

        <div class="review-items">
          <p class="review-section-label">Items</p>
          ${itemsHtml}
          <div class="review-row">
            <span class="rv-label">Subtotal</span><span>${taka(subtotal)}</span>
          </div>
          <div class="review-row">
            <span class="rv-label">Shipping${shipping === 0 ? ' (free)' : ''}</span><span>${taka(shipping)}</span>
          </div>
          <div class="review-row total-row">
            <span>Total</span><span>${taka(total)}</span>
          </div>
        </div>

        <div class="review-delivery">
          <p class="review-section-label">Delivery Details</p>
          <div class="review-row"><span class="rv-label">Name</span><span>${esc(delivery.name)}</span></div>
          <div class="review-row"><span class="rv-label">Phone</span><span>${esc(delivery.phone)}</span></div>
          <div class="review-row"><span class="rv-label">Address</span><span>${esc(delivery.address)}</span></div>
          <div class="review-row"><span class="rv-label">City</span><span>${esc(delivery.city)}${delivery.zip ? ` (${esc(delivery.zip)})` : ''}</span></div>
          ${delivery.notes ? `<div class="review-row"><span class="rv-label">Notes</span><span>${esc(delivery.notes)}</span></div>` : ''}
          <div class="review-row"><span class="rv-label">Payment</span><span>${esc(payMethod)}</span></div>
        </div>

        <div class="review-actions">
          <button class="btn-back" id="reviewBack">← Edit</button>
          <button class="btn-confirm" id="reviewConfirm">Confirm Order — ${taka(total)}</button>
        </div>
      </div>`;

    document.body.appendChild(overlay);

    /* close on backdrop click */
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

    /* close on Escape */
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

    function close() {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }

    document.getElementById('reviewBack').addEventListener('click', close);
    document.getElementById('reviewConfirm').addEventListener('click', () => {
      close();
      onConfirm();
    });

    /* focus confirm button for keyboard users */
    document.getElementById('reviewConfirm').focus();
  }

  /* submit — show review first, then place order on confirm */
  document.getElementById('checkoutForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!e.target.checkValidity()) { e.target.reportValidity(); return; }

    const delivery = {
      name:    document.getElementById('delivName').value.trim(),
      phone:   document.getElementById('delivPhone').value.trim(),
      address: document.getElementById('delivAddress').value.trim(),
      city:    document.getElementById('delivCity').value.trim(),
      zip:     (document.getElementById('delivZip') || {}).value.trim(),
      notes:   (document.getElementById('delivNotes') || {}).value.trim()
    };
    const payMethod = (document.querySelector('input[name="payOption"]:checked') || document.getElementById('payMethod') || {}).value || 'Cash on Delivery';

    showReviewModal(delivery, payMethod, async () => {
      const btn = document.getElementById('placeBtn');
      btn.disabled = true;
      btn.textContent = 'Placing order…';
      try {
        const data = await apiFetch('/api/orders', {
          method: 'POST',
          body: JSON.stringify({ items: getCart(), delivery, paymentMethod: payMethod })
        });
        clearCart();
        renderConfirmation(data.order, user.name);
      } catch (err) {
        showNotice(document.getElementById('checkoutMessage'), err.message);
        btn.disabled = false;
        btn.textContent = `Place Order — ${taka(total)}`;
      }
    });
  });
}

/* ── render empty cart ── */
function renderEmptyCart() {
  const emptyText = (_siteSettings && _siteSettings.cartEmptyMessage) || 'Your crate is empty';
  document.getElementById('main').innerHTML = `
    <div class="auth-gate">
      <h2>${esc(emptyText)}</h2>
      <p>Add something from this week's food before checking out.</p>
      <a href="/" class="btn-primary">Back to Shop</a>
    </div>`;
}

/* ── render auth gate ── */
function renderAuthGate() {
  const brand = (_siteSettings && _siteSettings.brandName) || 'ENMAR';
  document.getElementById('main').innerHTML = `
    <div class="auth-gate">
      <div class="auth-gate-icon">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <h2>অর্ডার সম্পন্ন করতে সাইন ইন করুন</h2>
      <p>আপনার অর্ডারটি নিশ্চিত ও লাইভ ডেলিভারি ট্র্যাকিং করার জন্য একটি একাউন্টে সাইন ইন বা রেজিস্টার করুন।</p>
      <div class="auth-gate-btn-wrap">
        <a href="/?login=1&checkout=1" class="btn-auth-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          সাইন ইন / একাউন্ট খুলুন →
        </a>
        <a href="/" class="btn-auth-secondary">← শপে ফিরে যান</a>
      </div>
    </div>`;
}

/* ── safe auth user fetch ── */
async function getAuthUser() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) return null;
    const data = await res.json().catch(() => ({}));
    return data.user || null;
  } catch {
    return null;
  }
}

/* ── boot ── */
(async () => {
  try {
    const [user, products, settings] = await Promise.all([
      getAuthUser(),
      apiFetch('/api/products').catch(() => []),
      apiFetch('/api/settings').catch(() => ({}))
    ]);

    _siteSettings = settings || {};
    PRODUCTS = products || [];
    if (typeof settings.shippingFlat === 'number')          SHIPPING_FLAT = settings.shippingFlat;
    if (typeof settings.shippingFreeThreshold === 'number') SHIPPING_FREE = settings.shippingFreeThreshold;

    /* staff → admin panel */
    if (user && ['superadmin','admin','manager','moderator'].includes(user.role)) {
      window.location.href = '/admin/dashboard';
      return;
    }

    /* not signed in → display clean Sign In message card */
    if (!user) {
      renderAuthGate();
      return;
    }

    /* empty cart */
    if (getLines().length === 0) {
      renderEmptyCart();
      return;
    }

    renderForm(user);

  } catch (err) {
    renderAuthGate();
  }
})();
</script>

<script src="/js/branding.js"></script>
</body>
