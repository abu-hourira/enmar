<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — ENMAR</title>
<meta name="description" content="Organic product details and customer reviews.">
<link rel="stylesheet" href="/css/harvest-market.css">
<script src="/js/devtools-guard.js"></script>
<script src="/js/theme.js"></script>
</head>
<body>

<!-- ── HEADER ── -->
<header class="site-header">
  <a class="logo" href="/" aria-label="ENMAR home">
    <span id="logoIcon"></span>
    <span id="brandName">ENMAR</span>
  </a>
  <nav class="header-nav" aria-label="Main">
    <a class="account-btn" href="/" data-nav-account>Shop</a>
  </nav>
  <div class="header-right">
    <button type="button" class="account-btn" id="accountBtn" aria-label="Account">Sign In</button>
    <a class="cart-btn" href="/checkout.html" aria-label="Go to checkout" style="position:relative;display:flex">
      <span id="basketIcon"></span>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </a>
  </div>
</header>

<main class="product-page">
  <div class="breadcrumb">
    <a href="/">&#8592; Back to shop</a>
  </div>
  <div id="productRoot" aria-live="polite">
    <p class="page-status">Loading product…</p>
  </div>
</main>

<!-- ── IN-PAGE AUTH MODAL ── -->
<div class="auth-modal-overlay" id="authModal" style="display:none">
  <div class="auth-modal-box">
    <div class="auth-modal-head">
      <div class="auth-head-text">
        <h2 id="authModalTitle">Sign In</h2>
        <p id="authModalSubtitle">Sign in or create an account to leave verified reviews.</p>
      </div>
      <button type="button" class="auth-modal-close" id="authModalClose" aria-label="Close">&times;</button>
    </div>
    <div class="auth-tabs-wrap" id="modalAuthTabs">
      <button type="button" class="auth-tab-btn active" id="modalLoginTab">Sign In</button>
      <button type="button" class="auth-tab-btn" id="modalRegisterTab">Register</button>
    </div>
    <div id="modalAuthMessage"></div>
    <form id="modalAuthForm" class="auth-form" novalidate>
      <div id="modalRegisterFields" style="display:none">
        <div class="auth-field">
          <label for="modalAuthName">Full Name *</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input id="modalAuthName" placeholder="e.g. Shakib Al Hasan" minlength="2">
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <label for="modalAuthEmailReg">Email Address *</label>
          <div class="auth-otp-row">
            <div class="auth-input-wrap">
              <span class="auth-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input id="modalAuthEmailReg" type="email" placeholder="you@domain.com">
            </div>
            <button type="button" id="modalSendOtpBtn" class="btn-auth-otp">Send code</button>
          </div>
        </div>
        <div class="auth-field" id="modalOtpFieldReg" style="margin-top:10px; display:none;">
          <label for="modalAuthOtp" style="color:var(--forest,#631e2a)">6-Digit Email Code *</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <input id="modalAuthOtp" placeholder="Enter 6-digit code" inputmode="numeric" maxlength="6" style="letter-spacing:4px; font-weight:700; font-family:monospace;">
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <label for="modalAuthPhone">Mobile Number (Bangladesh) *</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
            </span>
            <input id="modalAuthPhone" type="tel" placeholder="017XXXXXXXX" pattern="01[0-9]{9}">
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <label for="modalAuthPasswordReg">Password *</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="modalAuthPasswordReg" type="password" placeholder="Min. 8 characters (any type)" minlength="8" autocomplete="new-password">
            <button type="button" class="auth-toggle-pwd" data-target="modalAuthPasswordReg" title="Toggle password visibility">Show</button>
          </div>
          <div style="font-size:0.75rem; color:var(--ink-soft,#666); margin-top:4px;">
            Min. 8 characters (numbers, letters, symbols accepted)
          </div>
        </div>
      </div>
      <div id="modalForgotFields" style="display:none">
        <div class="auth-field">
          <label for="modalAuthEmailForgot">Registered Email</label>
          <div class="auth-otp-row">
            <div class="auth-input-wrap">
              <span class="auth-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input id="modalAuthEmailForgot" type="email" placeholder="Registered email address" autocomplete="email">
            </div>
            <button type="button" id="modalSendForgotOtpBtn" class="btn-auth-otp">Send code</button>
          </div>
        </div>
        <div class="auth-field" id="modalOtpFieldForgot" style="margin-top:10px; display:none;">
          <label for="modalAuthOtpForgot" style="color:var(--forest,#631e2a)">6-Digit Reset Code</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <input id="modalAuthOtpForgot" placeholder="Enter 6-digit reset code" inputmode="numeric" maxlength="6" style="letter-spacing:4px; font-weight:700; font-family:monospace;">
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <label for="modalAuthPasswordForgot">New Password (min 8 chars)</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="modalAuthPasswordForgot" type="password" placeholder="New Password (min 8 characters)" minlength="8" autocomplete="new-password">
            <button type="button" class="auth-toggle-pwd" data-target="modalAuthPasswordForgot" title="Toggle password visibility">Show</button>
          </div>
          <div id="modalForgotChkLen" style="font-size:0.75rem; color:var(--ink-soft,#666); margin-top:4px;">
            ○ Min. 8 characters (numbers, letters, symbols accepted)
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="modalAuthPasswordForgotConfirm" style="margin:0">Confirm New Password</label>
            <span id="modalForgotPwdMatchStatus" style="font-size:0.75rem; font-weight:700;"></span>
          </div>
          <div class="auth-input-wrap" style="margin-top:4px">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="modalAuthPasswordForgotConfirm" type="password" placeholder="Confirm New Password" minlength="8" autocomplete="new-password">
            <button type="button" class="auth-toggle-pwd" data-target="modalAuthPasswordForgotConfirm" title="Toggle password visibility">Show</button>
          </div>
        </div>
        <div style="display:flex;justify-content:center;margin-top:8px">
          <button type="button" id="modalBackToLoginBtn" class="btn-link" style="background:none;border:none;color:var(--forest,#631e2a);font-size:.84rem;font-weight:600;cursor:pointer;padding:4px;text-decoration:underline;">← Back to Sign In</button>
        </div>
      </div>
      <div id="modalLoginFields">
        <div class="auth-field">
          <label for="modalAuthEmail">Email Address</label>
          <div class="auth-input-wrap">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="modalAuthEmail" type="email" placeholder="Email address" required>
          </div>
        </div>
        <div class="auth-field" style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label for="modalAuthPassword" style="margin:0">Password</label>
            <button type="button" id="modalForgotBtn" style="background:none;border:none;color:var(--forest,#631e2a);font-size:.82rem;font-weight:600;cursor:pointer;padding:0;text-decoration:underline">Forgot password?</button>
          </div>
          <div class="auth-input-wrap" style="margin-top:4px">
            <span class="auth-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="modalAuthPassword" type="password" placeholder="Password" required minlength="8">
            <button type="button" class="auth-toggle-pwd" data-target="modalAuthPassword" title="Toggle password visibility">Show</button>
          </div>
        </div>
      </div>
      <button class="btn-auth-submit" type="submit" id="modalAuthSubmitBtn" style="margin-top:14px; width:100%;">Sign In</button>
      <!-- Registration Help Guide (Admin Controlled) -->
      <div class="auth-reg-guide" id="modalRegGuide" style="display:none"></div>
    </form>
  </div>
</div>

<!-- ── REVIEW IMAGE LIGHTBOX MODAL ── -->
<div class="modal-overlay lightbox-modal" id="reviewLightboxModal" style="display:none">
  <div class="lightbox-box">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
    <img id="lightboxImg" src="" alt="Enlarged review photo" class="lightbox-img">
  </div>
</div>

<!-- ── FOOTER ── -->
<footer class="site-footer">
  <div class="footer-bottom">
    <span>© 2026 ENMAR — Organic, Field to Door</span>
  </div>
</footer>

<script src="/js/product.js"></script>
<script src="/js/branding.js"></script>
</body>
</html>
