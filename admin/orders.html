<div class="sb-overlay" id="sbOverlay"></div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="orderDetailModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <h2 id="orderDetailTitle">Order Detail</h2>
      <button type="button" class="btn-muted" id="orderDetailClose">Close</button>
    </div>
    <div id="orderDetailContent"></div>
    <div class="order-detail-delivery">
      <!-- EST DELIVERY PICKER -->
      <div class="field">
        <label for="orderEstDelivery">Est. Delivery Date &amp; Time</label>
        <div id="orderEstCurrent" class="est-current"></div>
        <div class="est-delivery-row">
          <input type="datetime-local" id="orderEstDelivery" class="est-delivery-input">
          <div class="est-presets-row">
            <button type="button" class="btn-muted est-preset" data-hours="24">+24h</button>
            <button type="button" class="btn-muted est-preset" data-hours="48">+48h</button>
            <button type="button" class="btn-muted est-preset" data-hours="72">+3d</button>
            <button type="button" class="btn-muted est-preset" data-hours="168">+7d</button>
          </div>
        </div>
        <div id="orderEstMessage" class="est-message"></div>
      </div>
      <div class="est-save-row">
        <button type="button" class="btn-primary btn-primary--sm" id="orderEstSave">Set Delivery Time</button>
        <button type="button" class="btn-danger btn-primary--sm" id="orderEstClear">Clear</button>
      </div>
      <!-- AUDIT TRAIL / CHANGE HISTORY (TRUST RECORD) -->
      <div class="field" style="margin-top:16px">
        <label style="font-weight:700;color:var(--forest,#16a34a);display:flex;align-items:center;justify-content:space-between">
          <span>📜 Order Audit Trail &amp; Change History (Trust Record)</span>
          <span style="font-size:0.68rem;font-weight:400;color:var(--ink-soft,#78716c)">Immutable log</span>
        </label>
        <div id="customerDeletedNotice" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-left:4px solid #ef4444;border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:.78rem;color:#991b1b">
        </div>
        <div id="adminHistoryList" style="display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto;background:var(--paper-alt,#fafaf9);border:1px solid var(--line,#e7e5e4);border-radius:6px;padding:10px;margin-bottom:8px">
        </div>
      </div>
      <!-- CONVERSATION / COMMENTS THREAD -->
      <div class="field" style="margin-top:16px">
        <label style="font-weight:700;color:var(--forest,#16a34a)">💌 Order Messages & Customer Comments</label>
        <div id="adminThreadList" style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;background:var(--paper-alt,#fafaf9);border:1px solid var(--line,#e7e5e4);border-radius:6px;padding:10px;margin-bottom:8px">
        </div>
        <div style="display:flex;gap:6px">
          <input type="text" id="adminReplyInput" class="input-full" placeholder="Reply to customer or send a message…" style="flex:1">
          <button type="button" class="btn-primary btn-primary--sm" id="adminReplyBtn">Send Reply</button>
        </div>
        <div id="adminReplyMessage"></div>
      </div>
      <input type="hidden" id="orderNoteId">
    </div>
  </div>
</div>

<script src="/admin/admin-core.js"></script>
<script>
let allOrders = [], canDel = false, refreshTimer = null;

(async () => {
  const user = await initAdminPage();
  if (!user) return;
  canDel = ['superadmin', 'admin'].includes(user.role);
  try {
    allOrders = await api('/api/admin/orders');
    renderTable();
  } catch (err) {
    notice($('globalMessage'), err.message);
  }

  refreshTimer = setInterval(async () => {
    try {
      allOrders = await api('/api/admin/orders');
      renderTable();
    } catch { /* silent */ }
  }, 15000);
})();

function renderTable() {
  const q = ($('orderSearch').value || '').toLowerCase();
  const status = $('orderStatusFilter').value;
  const list = allOrders.filter(o => {
    const mq = !q || o.number.toLowerCase().includes(q)
      || (o.customer?.name || '').toLowerCase().includes(q)
      || (o.customer?.phone || '').includes(q);
    return mq && (!status || o.status === status);
  });
  $('ordersCount').textContent = `${list.length} / ${allOrders.length}`;
  $('ordersTable').innerHTML = list.length
    ? buildOrderTable(list, true, canDel)
    : '<div class="empty-state">No orders match your filter.</div>';
  bindStatusSelects();
  bindOrderActions();
  startCountdowns();
}

function bindStatusSelects() {
  document.querySelectorAll('.statusSelect').forEach(sel => {
    sel.onchange = async () => {
      const oid = Number(sel.dataset.order);
      const o = allOrders.find(x => x.id === oid);
      const prevStatus = o ? o.status : '';
      try {
        const updated = await api(`/api/admin/orders/${oid}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: sel.value })
        });
        if (o) Object.assign(o, updated);
        notice($('globalMessage'), `Order ${o?.number || '#' + oid} status changed to "${sel.value}".`, true);
        renderTable();
      } catch (err) {
        if (o) sel.value = prevStatus;
        notice($('globalMessage'), err.message);
      }
    };
  });
}

function bindOrderActions() {
  document.querySelectorAll('.btn-order-detail').forEach(btn => {
    btn.onclick = () => openOrderDetail(Number(btn.dataset.oid));
  });
  document.querySelectorAll('.btn-countdown-edit').forEach(btn => {
    btn.onclick = () => openOrderDetail(Number(btn.dataset.oid));
  });
  document.querySelectorAll('.btn-order-delete').forEach(btn => {
    btn.onclick = async () => {
      const o = allOrders.find(x => x.id === Number(btn.dataset.oid));
      if (!confirm(`Delete order ${o?.number}? Cannot be undone.`)) return;
      try {
        await api(`/api/admin/orders/${btn.dataset.oid}`, { method: 'DELETE' });
        notice($('globalMessage'), `Order ${o?.number} deleted successfully.`, true);
        allOrders = await api('/api/admin/orders');
        renderTable();
      } catch (err) {
        notice($('globalMessage'), err.message);
      }
    };
  });
}

function openOrderDetail(oid) {
  const o = allOrders.find(x => x.id === oid); if (!o) return;
  $('orderDetailTitle').innerHTML = `Order ${esc(o.number)} <a href="/receipt?id=${o.id}" target="_blank" class="btn-soft" style="margin-left:12px;font-size:0.72rem;padding:3px 10px;text-decoration:none;color:var(--forest,#16a34a);font-weight:600;display:inline-flex;align-items:center;gap:4px">🧾 View / Print Receipt</a>`;
  $('orderNoteId').value = oid;
  if ($('adminReplyInput')) $('adminReplyInput').value = '';
  // show currently saved EST date
  const cur = $('orderEstCurrent');
  if (o.estimatedDelivery) {
    const d = new Date(o.estimatedDelivery);
    cur.innerHTML = `<span class="est-current-label">Saved:</span> ${d.toLocaleString('en-BD', { dateStyle: 'medium', timeStyle: 'short' })}`;
  } else {
    cur.innerHTML = '<span class="est-current-label">No delivery time set yet.</span>';
  }
  // pre-fill EST delivery picker
  if (o.estimatedDelivery) {
    $('orderEstDelivery').value = toLocalDatetimeInput(o.estimatedDelivery);
  } else if (o.confirmedAt) {
    $('orderEstDelivery').value = toLocalDatetimeInput(new Date(o.confirmedAt).getTime() + DELIVERY_WINDOW_MS);
  } else {
    $('orderEstDelivery').value = '';
  }
  notice($('orderEstMessage'), '');
  $('orderDetailContent').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.83rem;margin-bottom:12px">
      <div><span style="font-family:var(--font-mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase">Customer</span><br>${esc(o.customer?.name)} · ${esc(o.customer?.phone)}</div>
      <div><span style="font-family:var(--font-mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase">Address</span><br>${esc(o.customer?.address)}, ${esc(o.customer?.city)}</div>
      <div><span style="font-family:var(--font-mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase">Payment</span><br>${esc(o.paymentMethod)}</div>
      <div><span style="font-family:var(--font-mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase">Total</span><br>${taka(o.total)} (ship ${taka(o.shipping)})</div>
      <div style="grid-column:span 2"><span style="font-family:var(--font-mono);font-size:.62rem;color:var(--ink-soft);text-transform:uppercase">Status</span><br><strong>${esc(o.status)}</strong>${o.status === 'Cancelled' ? ` <span style="font-size:.75rem;color:#b91c1c;font-weight:700">(${esc(o.cancelledBy === 'customer' ? `Cancelled by ${o.cancelledByName || o.customer?.name || o.user?.name || 'Customer'} — Locked` : 'Cancelled by ENMAR')})</span>` : ''}</div>
    </div>
    <table class="data-table"><thead><tr><th>Product ID</th><th>Qty</th></tr></thead><tbody>
    ${o.items.map(i => `<tr><td>${i.id}</td><td>${i.qty}</td></tr>`).join('')}
    </tbody></table>`;

  const delNotice = $('customerDeletedNotice');
  if (delNotice) {
    if (o.customerHidden) {
      delNotice.style.display = 'block';
      delNotice.innerHTML = `<strong>🗑️ Customer History Notice:</strong> The customer (<strong>${esc(o.customer?.name || 'Customer')}</strong>) deleted/removed this order from their personal order history on <strong>${new Date(o.customerDeletedAt || o.createdAt).toLocaleString('en-BD', { dateStyle: 'medium', timeStyle: 'short' })}</strong>.<br><span style="font-size:.72rem;color:#7f1d1d">Master order details &amp; immutable audit log are permanently retained in this admin panel for audit trust.</span>`;
    } else {
      delNotice.style.display = 'none';
      delNotice.innerHTML = '';
    }
  }

  renderAdminHistory(o);
  renderAdminThread(o);
  notice($('adminReplyMessage'), '');
  openModal('orderDetailModal');
}

function renderAdminThread(o) {
  const listEl = $('adminThreadList');
  if (!listEl) return;
  const brandName = 'ENMAR';
  let msgs = Array.isArray(o.messages) && o.messages.length ? o.messages : [];
  if (!msgs.length) {
    msgs = [{
      id: 1,
      sender: 'store',
      senderName: brandName,
      text: o.customerMessage || o.note || 'Thank you',
      createdAt: o.createdAt || new Date().toISOString()
    }];
  }
  listEl.innerHTML = msgs.map(m => {
    const isStore = ['store', 'staff', 'admin', 'manager', 'superadmin'].includes(m.sender);
    const timeStr = (m.createdAt || m.timestamp) ? new Date(m.createdAt || m.timestamp).toLocaleTimeString('en-BD', { hour: '2-digit', minute: '2-digit', hour12: true, month: 'short', day: 'numeric' }) : '';
    return `
      <div style="padding:7px 10px;border-radius:6px;background:${isStore ? '#f0fdf4;border-left:3.5px solid #16a34a' : '#f8fafc;border-left:3.5px solid #3b82f6'};font-size:.82rem">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:.65rem;margin-bottom:2px">
          <strong style="color:${isStore ? '#15803d' : '#1d4ed8'}">${isStore ? `🌾 ${esc(m.senderName || brandName)}` : `👤 ${esc(m.senderName || 'Customer')}`}</strong>
          <span style="color:var(--ink-soft);font-family:var(--font-mono)">${esc(timeStr)}</span>
        </div>
        <div style="color:var(--ink);white-space:pre-wrap">${esc(m.text || m.message || '')}</div>
      </div>
    `;
  }).join('');
  listEl.scrollTop = listEl.scrollHeight;
}

// preset buttons fill the datetime input relative to now
document.querySelectorAll('.est-preset').forEach(btn => {
  btn.onclick = () => {
    const ms = Number(btn.dataset.hours) * 3600000;
    $('orderEstDelivery').value = toLocalDatetimeInput(Date.now() + ms);
  };
});

// helper: ms/ISO → value string for datetime-local input (YYYY-MM-DDTHH:MM)
function toLocalDatetimeInput(msOrIso) {
  const d = new Date(msOrIso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

$('orderEstSave').onclick = async () => {
  const oid = Number($('orderNoteId').value);
  const val = $('orderEstDelivery').value;
  if (!val) { notice($('orderEstMessage'), 'Please pick a date and time.'); return; }
  const iso = new Date(val).toISOString();
  try {
    const updated = await api(`/api/admin/orders/${oid}`, {
      method: 'PATCH',
      body: JSON.stringify({ estimatedDelivery: iso })
    });
    const o = allOrders.find(x => x.id === oid);
    if (o) {
      Object.assign(o, updated);
      renderAdminHistory(o);
    }
    const d = new Date(updated.estimatedDelivery);
    $('orderEstCurrent').innerHTML = `<span class="est-current-label">Saved:</span> ${d.toLocaleString('en-BD', { dateStyle: 'medium', timeStyle: 'short' })}`;
    notice($('orderEstMessage'), 'Delivery time saved.', true);
    renderTable();
  } catch (err) { notice($('orderEstMessage'), err.message); }
};

$('orderEstClear').onclick = async () => {
  const oid = Number($('orderNoteId').value);
  if (!confirm('Remove the estimated delivery time for this order?')) return;
  try {
    const updated = await api(`/api/admin/orders/${oid}`, {
      method: 'PATCH',
      body: JSON.stringify({ estimatedDelivery: null })
    });
    const o = allOrders.find(x => x.id === oid);
    if (o) {
      Object.assign(o, updated);
      renderAdminHistory(o);
    }
    $('orderEstDelivery').value = '';
    $('orderEstCurrent').innerHTML = '<span class="est-current-label">No delivery time set yet.</span>';
    notice($('orderEstMessage'), 'Delivery time cleared.', true);
    renderTable();
  } catch (err) { notice($('orderEstMessage'), err.message); }
};

$('orderDetailClose').onclick = () => closeModal('orderDetailModal');
$('adminReplyBtn').onclick = async () => {
  const oid = Number($('orderNoteId').value);
  const text = ($('adminReplyInput').value || '').trim();
  if (!text) return;
  $('adminReplyBtn').disabled = true;
  $('adminReplyBtn').textContent = 'Sending…';
  notice($('adminReplyMessage'), '');
  try {
    const res = await api(`/api/admin/orders/${oid}/messages`, {
      method: 'POST',
      body: JSON.stringify({ text })
    });
    const o = allOrders.find(x => x.id === oid);
    if (o) {
      if (res.order) {
        Object.assign(o, res.order);
      } else {
        o.messages = res.messages || (o.messages ? [...o.messages, res.message] : [res.message]);
        if (res.message) o.customerMessage = res.message.text;
      }
    }
    $('adminReplyInput').value = '';
    $('adminReplyBtn').disabled = false;
    $('adminReplyBtn').textContent = 'Send Reply';
    if (o) {
      renderAdminThread(o);
      renderAdminHistory(o);
    }
    notice($('adminReplyMessage'), 'Reply sent to customer.', true);
    renderTable();
  } catch (err) {
    notice($('adminReplyMessage'), err.message);
    $('adminReplyBtn').disabled = false;
    $('adminReplyBtn').textContent = 'Send Reply';
  }
};

$('orderSearch').addEventListener('input', renderTable);
$('orderStatusFilter').addEventListener('change', renderTable);
</script>
</body>
</html>
